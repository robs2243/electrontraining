<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/671/index.min.js" rel="stylesheet">

</head>

<body>

    <div class="container-fluid">
        <div class="row align-items-center mt-2">
            <div class="col-2 ps-2">
                <button type="button" class="btn btn-primary btn-sm w-100" id="btn_zuruck">Zurück</button>
            </div>

            <div class="col-4 text-center">
                <p class="mb-0">Musterlösung</p>
            </div>

            <div class="col-2 text-end">
                <p class="mb-0">max. Punkte</p>
            </div>

            <div class="col-2 text-start">
                <p class="mb-0">10</p>
            </div>

            <div class="col-2 ps-2">
                <button type="button" class="btn btn-primary btn-sm w-100" id="btn_vor">Vor</button>
            </div>

        </div>

        <div class="row mt-2">
            <div class="col-12 ps-2">
                <img src="katze.jpg" class="img-fluid w-100" style="height: 300px; object-fit: cover;"
                    alt="Beispielbild" id="bild">
            </div>
        </div>

        
        <div class="row mt-2">
            <div class="col-12 ps-2">
                <img src="hund.jpg" class="img-fluid w-100" style="height: 300px; object-fit: cover;"
                    alt="Beispielbild" id="bild_unten">
            </div>
        </div>

        <div class="row align-items-center mt-2">

            <div class="col-2 ps-2">
                <button type="button" class="btn btn-primary btn-sm w-100" id="btn_unten_zuruck">Zurück</button>
            </div>

            <div class="col-8 text-center">
                <p class="mb-0">Hallo. Was geht ab? Ich nutze jetzt 8 Spalten Platz.</p>
            </div>

            <div class="col-2 ps-2">
                <button type="button" class="btn btn-primary btn-sm w-100" id="btn_unten_vor">Vor</button>
            </div>

        </div>

    </div>

    <script src="bootstrapPractice.js"></script>
</body>

</html>
